<!doctype html>
<meta charset="utf-8">
<style>
  body{font:14px system-ui,sans-serif;width:280px;padding:14px;margin:0}
  button{width:100%;padding:11px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
  label{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:13px}
  #out{margin-top:12px;font-size:13px;line-height:1.5;white-space:pre-line}
  a{font-size:12px;display:block;margin-top:12px}
  @media (prefers-color-scheme:dark){body{background:#111827;color:#f3f4f6} a{color:#93c5fd}}
</style>
<button id="go">Fill this application</button>
<label><input type="checkbox" id="keep" checked> Keep filling next pages automatically</label>
<label><input type="checkbox" id="next"> Also click Next / Continue (never Submit)</label>
<div id="out"></div>
<a href="#" id="opts">Profile and settings</a>
<script src="popup.js"></script>
