<!doctype html>
<meta charset="utf-8"><title>Senior ML Engineer - Acme</title>
<h1>Senior ML Engineer</h1>
<main>
<div id="step1">
  <label for="fn">First Name *</label><input id="fn" name="first_name">
  <label for="ln">Last Name *</label><input id="ln" name="last_name">
  <label for="em">Email</label><input id="em" type="email">
  <label for="ph">Phone</label><input id="ph" type="tel">
  <label for="li">LinkedIn Profile</label><input id="li">
  <label for="co">Country</label>
  <select id="co"><option value="">Select...</option><option value="US">United States</option><option value="CA">Canada</option></select>
  <label for="city">City</label><input id="city" autocomplete="address-level2">
  <label for="state">Province</label><input id="state" autocomplete="address-level1">
  <label for="zip">Postal code</label><input id="zip" autocomplete="postal-code">
  <label for="workcountries">Countries where you want to work</label>
  <select id="workcountries" multiple><option>United States</option><option>Canada</option></select>
  <label for="salaryUsd">What are your yearly salary expectations? (USD)</label><input id="salaryUsd" type="number">
  <label for="salaryPkr">What are your monthly salary expectations in PKR?</label><input id="salaryPkr" type="number">
  <label for="salaryRange">Expected annual salary (USD)</label>
  <select id="salaryRange"><option value="">Select</option><option>Under $40,000</option><option>$40,000 - $59,999</option><option>$60,000 - $89,999</option><option>$90,000+</option></select>
  <label for="salaryCurrency">What currency are your monthly salary expectations?</label>
  <select id="salaryCurrency"><option value="">Select</option><option>USD</option><option>PKR</option></select>
  <label for="cv">Resume/CV</label><input id="cv" type="file" accept=".pdf">
  <div><div>Are you legally authorized to work in Canada?</div>
    <label><input type="radio" name="auth" value="y"> Yes</label>
    <label><input type="radio" name="auth" value="n"> No</label></div>
  <label for="basis">Canada: Authorization basis</label>
  <select id="basis"><option value="">Select</option><option>Citizen</option><option>Permanent resident</option><option>Sample permit</option></select>
  <label for="sponsor">Will you now or in the future require employer sponsorship in Canada?</label>
  <select id="sponsor"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="adult">Are you 18 years of age or older?</label>
  <select id="adult"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <button id="next1" type="button">Save and Continue</button>
</div>
<div id="step2" style="display:none">
  <label for="mcp">Have you used Model Context Protocol (MCP) to manage tools or memory?</label><textarea id="mcp"></textarea>
  <label for="prod">Have you built an agentic AI system in production?</label><textarea id="prod"></textarea>
  <label for="frameworks">Have you worked hands-on with LangChain/LangGraph or Vertex AI Agent Builder to build agentic AI or multi-agent systems?</label><textarea id="frameworks"></textarea>
  <label for="frameworkChoice">Have you worked hands-on with LangChain/LangGraph or Vertex AI Agent Builder to build agentic AI or multi-agent systems?</label>
  <select id="frameworkChoice"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="rag">Do you have production experience building RAG/LLM applications using vector databases such as Pinecone, Weaviate, Chroma, or BigQuery Vector Search?</label><textarea id="rag"></textarea>
  <label for="ragChoice">Do you have production experience building RAG/LLM applications using vector databases such as Pinecone, Weaviate, Chroma, or BigQuery Vector Search?</label>
  <select id="ragChoice"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="multiChoice">Have you delivered multi-agent orchestration?</label>
  <select id="multiChoice"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="ker">Do you have Kubernetes certification?</label><textarea id="ker"></textarea>
  <label for="kerSimilar">Do you currently hold a Kubernetes certification?</label><textarea id="kerSimilar"></textarea>
  <label for="citizen">Are you a citizen of Canada?</label>
  <select id="citizen"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="gen">Gender</label>
  <select id="gen"><option value="">Select</option><option>Option A</option><option>Option B</option><option>Decline to self-identify</option></select>
  <label for="disability">Do you have a disability?</label><select id="disability"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="lgbtq">Do you identify as LGBTQ+?</label><select id="lgbtq"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="race">How would you identify your race?</label><select id="race"><option value="">Select</option><option>Option A</option><option>Option B</option></select>
  <label for="hispanic">Are you Hispanic or Latino?</label><select id="hispanic"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="veteran">Are you a veteran?</label><select id="veteran"><option value="">Select</option><option>Yes</option><option>No</option></select>
  <label for="pronouns">What are your pronouns?</label><select id="pronouns"><option value="">Select</option><option>Option A</option><option>Option B</option></select>
  <fieldset>
    <legend>Which contact channels do you prefer? (mark all that apply)</legend>
    <label><input type="checkbox" value="Email"> Email</label>
    <label><input type="checkbox" value="SMS"> SMS</label>
  </fieldset>
  <label><input type="checkbox" id="agree"> I agree to the privacy policy</label>
  <button type="button">Submit Application</button>
</div>
</main>
<script>
  document.getElementById('next1').onclick = () => {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  };
</script>
